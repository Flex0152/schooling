apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main

  workspaces:
    - name: output

  steps:
    - name: clone
      image: alpine/git:2.47.2
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -eu

        echo "Cloning repository..."

        git clone \
          --branch "$(params.revision)" \
          --depth 1 \
          "$(params.url)" \
          repository
