apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unittest
spec:
  workspaces:
    - name: source

  steps:
    - name: run-tests
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/repository
      script: |
        #!/bin/sh
        set -eu

        python -m unittest discover \
          -s . \
          -p "test_*.py" \
          -v